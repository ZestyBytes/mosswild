<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosswild · Art collection</title><style>body{margin:0;background:#20362c;color:#f5e6bd;font:16px system-ui;line-height:1.5}main{max-width:980px;margin:auto;padding:24px}h1{font-size:32px}section{margin:24px 0;padding:20px;background:#304b3c;border:1px solid #6a7950;border-radius:14px}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;background:repeating-conic-gradient(#d3cba7 0 25%,#e4dbb8 0 50%) 0/16px 16px;margin:16px auto}button,a{background:#e5c789;color:#293f31;padding:10px 14px;border:0;border-radius:7px;font:inherit;cursor:pointer}small{display:block;color:#c4cfb1}#loading{color:#e5c789}</style></head><body><main><a href="index.html">Back to Mosswild</a><h1>The Mosswild art collection</h1><p>Characters, places and small friends in the valley. Preview or download each transparent game sheet.</p><p id="loading">Loading artwork…</p><div id="sheets"></div></main><script src="pixel-atlas.js"></script><script>
const sheets=[{name:'Traveller',atlas:PlayerPixels,cols:4,rows:2,w:64,h:96,note:'Standing and walking · front, side, three-quarter, back',file:'player-64x96.png'},{name:'Nine companions',atlas:CompanionPixels,cols:6,rows:3,w:64,h:64,note:'Front and side pairs · Pip, Emberkin, Dewdrop, Lunamoth, Bramble, Talus, Fennel, Pearl, Nova',file:'companions-64x64.png'},{name:'People of the valley',atlas:new PixelAtlas('assets/npc-portraits.png',4,2,64,96,true,null,npcSourceRects),cols:4,rows:2,w:64,h:96,note:'Mara, Nell, Tessa, Rowan · Iris, Kai, Sage',file:'npcs-64x96.png'},{name:'Overworld tiles',atlas:new PixelAtlas('assets/overworld-tiles.png',8,4,32,32,false),cols:8,rows:4,w:32,h:32,note:'Terrain, shores, nature, modular buildings, bridges and interiors · 32 × 32 tiles',file:'tiles-32x32.png',tiles:true},{name:'Landmarks',atlas:new PixelAtlas('assets/landmarks.png',3,5,120,105,true,[0,286,585,806,1042,1420]),cols:3,rows:5,w:120,h:105,note:'Broken → mid-repair → restored · Nursery, lift, boardwalk, harbour, observatory',file:'landmarks-120x105.png'}];
function renderSheets(){for(const s of sheets){if(!s.atlas.ready||s.shown)continue;s.shown=true;const section=document.createElement('section'),heading=document.createElement('h2'),note=document.createElement('small'),canvas=document.createElement('canvas'),button=document.createElement('button');heading.textContent=s.name;note.textContent=s.note;canvas.width=s.cols*s.w;canvas.height=s.rows*s.h;const g=canvas.getContext('2d');g.imageSmoothingEnabled=false;for(let i=0;i<s.cols*s.rows;i++){if(s.tiles)s.atlas.tile(g,i,i%s.cols*s.w,Math.floor(i/s.cols)*s.h,s.w,s.h);else{const f=s.atlas.frames[i];if(!f)continue;const ratio=Math.min((s.w-8)/f.width,(s.h-10)/f.height);g.drawImage(f,Math.round(i%s.cols*s.w+(s.w-f.width*ratio)/2),Math.round(Math.floor(i/s.cols)*s.h+s.h-5-f.height*ratio),Math.round(f.width*ratio),Math.round(f.height*ratio));}}canvas.setAttribute('aria-label',s.name+' sprite sheet');canvas.style.width=Math.min(900,canvas.width*2)+'px';button.textContent='Download '+s.name.toLowerCase();button.onclick=()=>{const a=document.createElement('a');a.download=s.file;a.href=canvas.toDataURL('image/png');a.click();};section.append(heading,note,canvas,button);document.getElementById('sheets').append(section);}if(sheets.every(s=>s.shown))document.getElementById('loading').hidden=true;}
document.addEventListener('mosswild-art-ready',renderSheets);renderSheets();
</script></body></html>
